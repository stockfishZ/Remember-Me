<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RememberMe v2 - Authentic Retro 16-Bit RPG Launch Video</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #050508;
      color: #FFFFFF;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    #canvas {
      width: 1920px;
      height: 1080px;
      background: #050508;
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
  </style>
</head>
<body>
<canvas id="canvas" width="1920" height="1080"></canvas>

<script>
// ============================================================================
// RETRO 16-BIT / 8-BIT GAME ENGINE (480x270 native -> 1920x1080 nearest neighbor)
// ============================================================================
const displayCanvas = document.getElementById('canvas');
const displayCtx = displayCanvas.getContext('2d');
displayCtx.imageSmoothingEnabled = false;

// Internal Retro Resolution: 480x270 (exact 16:9, scaled 4.0x to 1080p)
const NATIVE_W = 480;
const NATIVE_H = 270;
const offscreen = document.createElement('canvas');
offscreen.width = NATIVE_W;
offscreen.height = NATIVE_H;
const ctx = offscreen.getContext('2d');
ctx.imageSmoothingEnabled = false;

const TOTAL_FRAMES = 1320;
const FPS = 60;

// Universal Skill Names from real catalog (48 skills, 6x8 grid)
const SKILL_NAMES = [
  "postgresql", "docker-exp", "react-pat", "aws-audit", "grill-me", 
  "turborepo", "nextjs-app", "syst-debug", "graphql", "fastapi", 
  "redis-mem", "agent-mem", "prisma", "clerk-auth", "stripe-pay", 
  "kubernetes", "tailwind", "solidity", "vite-core", "clickhouse", 
  "sentry-io", "playwright", "datadog", "terraform", "celery", 
  "elastic", "kafka-str", "git-master", "pydantic", "supabase", 
  "mongo-db", "zod-schema", "weaviate", "langgraph", "prompt-eng", 
  "jwt-auth", "oauth-sso", "vitest", "caddy-srv", "nginx", 
  "bun-run", "cf-workers", "dynamodb", "grpc-core", "websockets", 
  "prometheus", "grafana", "cypress"
];

// Rich 16-bit RPG Palettes
const PALETTE = {
  bgDark: "#08060f",
  stoneDark: "#131022",
  stoneMid: "#1e1a34",
  stoneLight: "#2c264a",
  mortar: "#0a0814",
  floorDark: "#181428",
  floorMid: "#26223a",
  floorLight: "#383254",
  terracotta: "#DA7757",
  terracottaHighlight: "#E88C72",
  terracottaShadow: "#B55639",
  hudBlueBg: "#0c183a",
  hudBlueBorder: "#20427d",
  hudWhite: "#FFFFFF",
  hudRed: "#E74C3C",
  hudGreen: "#2ECC71",
  hudGold: "#F1C40F",
  magicCyan: "#00F0FF",
  magicPurple: "#6C3483",
  magicPurpleLight: "#A569BD",
  woodDark: "#2A1408",
  woodMid: "#4E250F",
  woodLight: "#7A3D1B",
  woodHighlight: "#A8582C"
};

// Deterministic Pseudo-Random Generator
function seededRandom(seed) {
  const x = Math.sin(seed * 997.13 + 12.34) * 10000;
  return x - Math.floor(x);
}

// Math Helpers
const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeOutQuad = t => t * (2 - t);
const easeInQuad = t => t * t;
const easeOutCubic = t => (--t) * t * t + 1;
const easeInCubic = t => t * t * t;
const easeInOutQuad = t => t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;

// Harmonic Spring Physics Helper (for organic retrieval motion with slight overshoot)
function getSpringProgress(t, damping = 0.65, freq = 5.5) {
  if (t <= 0) return 0;
  if (t >= 1) return 1;
  const decay = Math.exp(-damping * freq * t);
  const osc = Math.cos(freq * Math.sqrt(Math.max(0.01, 1 - damping * damping)) * t);
  return 1 - decay * osc;
}

// Precompute Falling Skill Badges Physics (Act 1 Avalanche & Towering Pile)
// CRITICAL: Claude is at x = 110, y = 205.
// Badges fall strictly in front of him: X range = 200 to 440 (NOT in x < 180).
// Fast and punchy: all badges fall and pile settles by frame 145-150.
const BADGES = SKILL_NAMES.map((name, i) => {
  const r1 = seededRandom(i * 7 + 1);
  const r2 = seededRandom(i * 7 + 2);
  const r3 = seededRandom(i * 7 + 3);
  const r4 = seededRandom(i * 7 + 4);

  // Staggered drops between frame 10 and 95
  const dropStart = 10 + (i * 1.7) + (r1 * 4.0);
  
  // 8 primary pile columns strictly between x = 215 and 425
  const col = i % 8;
  const row = Math.floor(i / 8);
  const colBaseX = 215 + col * 30;
  const pileX = clamp(colBaseX + (r2 - 0.5) * 8, 208, 432);
  
  // Towering pile height (row 0 at ground y=202, up to row 5 at y=155)
  const pileY = 202 - (row * 9) - (r3 * 4);
  const pileRot = (r4 - 0.5) * 0.35; // Chaotic natural tilt
  
  const startX = clamp(pileX + (r1 - 0.5) * 10, 208, 432);
  const startY = -25 - (r2 * 45);

  const badgeColors = ["#E67E22", "#3498DB", "#2ECC71", "#9B59B6", "#E74C3C", "#F39C12", "#1ABC9C", "#E84393"];
  const color = badgeColors[i % badgeColors.length];

  // In Act 2/3, badges lift off from pile between frame 220 and 320
  const spiralStart = 220 + (i * 2.3);
  const shelfSlotIndex = i % 24;

  return {
    name,
    dropStart,
    startX,
    startY,
    pileX,
    pileY,
    pileRot,
    color,
    spiralStart,
    shelfSlotIndex,
    seed: r1
  };
});

// Ambient Floating Particles
const PARTICLES = Array.from({ length: 32 }, (_, i) => ({
  x: seededRandom(i * 7 + 1) * NATIVE_W,
  y: seededRandom(i * 7 + 2) * NATIVE_H,
  speed: 0.18 + seededRandom(i * 7 + 3) * 0.35,
  size: (i % 3 === 0) ? 2 : 1,
  color: (i % 2 === 0) ? PALETTE.magicCyan : PALETTE.hudGold
}));

// Confetti Particles for Celebrations
const CONFETTI = Array.from({ length: 48 }, (_, i) => ({
  x: seededRandom(i * 11 + 1) * NATIVE_W,
  yOffset: seededRandom(i * 11 + 2) * 200,
  speed: 1.2 + seededRandom(i * 11 + 3) * 1.5,
  wobbleSpeed: 2.0 + seededRandom(i * 11 + 4) * 3.0,
  color: ["#F1C40F", "#E74C3C", "#2ECC71", "#00F0FF", "#9B59B6", "#FFFFFF"][i % 6]
}));

// ============================================================================
// DRAWING ROUTINES (All on 480x270 integer pixel grid)
// ============================================================================

// 1. Tiled Stone Dungeon Background & Animated Torches
function drawDungeonBackground(frame) {
  ctx.fillStyle = PALETTE.bgDark;
  ctx.fillRect(0, 0, NATIVE_W, NATIVE_H);

  // Brick rows
  const brickH = 14;
  const brickW = 28;
  for (let y = 0; y < 205; y += brickH) {
    const row = Math.floor(y / brickH);
    const xOffset = (row % 2 === 0) ? 0 : 14;
    for (let x = -14; x < NATIVE_W; x += brickW) {
      const bx = x + xOffset;
      const shade = (y < 70) ? PALETTE.stoneDark : ((y < 140) ? PALETTE.stoneMid : PALETTE.stoneLight);
      ctx.fillStyle = shade;
      ctx.fillRect(bx + 1, y + 1, brickW - 2, brickH - 2);

      ctx.fillStyle = (y < 70) ? PALETTE.stoneMid : PALETTE.stoneLight;
      ctx.fillRect(bx + 1, y + 1, brickW - 2, 1);

      ctx.fillStyle = PALETTE.mortar;
      ctx.fillRect(bx, y, brickW, 1);
      ctx.fillRect(bx, y, 1, brickH);
    }
  }

  // Stone Floor (y = 205 to 270)
  ctx.fillStyle = PALETTE.floorMid;
  ctx.fillRect(0, 205, NATIVE_W, 65);

  const tileW = 32;
  const tileH = 16;
  for (let fy = 205; fy < 270; fy += tileH) {
    const fRow = Math.floor((fy - 205) / tileH);
    const fxOffset = (fRow % 2 === 0) ? 0 : 16;
    for (let fx = -16; fx < NATIVE_W; fx += tileW) {
      const tx = fx + fxOffset;
      ctx.fillStyle = ((fRow + Math.floor(tx / tileW)) % 2 === 0) ? PALETTE.floorMid : PALETTE.floorDark;
      ctx.fillRect(tx + 1, fy + 1, tileW - 2, tileH - 2);

      ctx.fillStyle = PALETTE.floorLight;
      ctx.fillRect(tx + 1, fy + 1, tileW - 2, 1);

      ctx.fillStyle = PALETTE.mortar;
      ctx.fillRect(tx, fy, tileW, 1);
      ctx.fillRect(tx, fy, 1, tileH);
    }
  }

  // Stone Pillars
  drawStonePillar(42, 32, 205);
  drawStonePillar(320, 32, 205);

  // Wall Torches mounted on Pillars
  drawWallTorch(42, 105, frame);
  drawWallTorch(320, 105, frame + 17);
}

function drawStonePillar(x, topY, botY) {
  const pw = 20;
  ctx.fillStyle = PALETTE.stoneDark;
  ctx.fillRect(x - pw / 2, topY, pw, botY - topY);

  ctx.fillStyle = PALETTE.stoneLight;
  ctx.fillRect(x - pw / 2 + 1, topY, 3, botY - topY);
  ctx.fillStyle = PALETTE.stoneMid;
  ctx.fillRect(x - pw / 2 + 4, topY, pw - 6, botY - topY);

  ctx.fillStyle = PALETTE.stoneLight;
  ctx.fillRect(x - pw / 2 - 4, topY, pw + 8, 5);
  ctx.fillRect(x - pw / 2 - 4, botY - 5, pw + 8, 5);
  ctx.fillStyle = PALETTE.stoneDark;
  ctx.fillRect(x - pw / 2 - 4, topY + 5, pw + 8, 1);
  ctx.fillRect(x - pw / 2 - 4, botY - 6, pw + 8, 1);
}

function drawWallTorch(x, y, frame) {
  ctx.fillStyle = "#4A3B32";
  ctx.fillRect(x - 2, y, 4, 10);
  ctx.fillStyle = "#2A1B12";
  ctx.fillRect(x - 4, y + 2, 8, 3);

  const animFrame = Math.floor((frame / 6) % 4);
  const flamePixels = [
    ["....YY....","...YYYY...","..YYYYYY..","..OOOOOO..",".OOOOOOOO.","..RRRRRR.."],
    ["...YY.....","..YYYY....",".YYYYYY...","..OOOOOO..",".OOOOOOOO.","..RRRRRR.."],
    [".....YY...","....YYYY..","...YYYYYY.","..OOOOOO..",".OOOOOOOO.","..RRRRRR.."],
    ["....YY....","..YYYYYY..",".YYYYYYYY.","..OOOOOO..",".OOOOOOOO.","..RRRRRR.."]
  ];

  const grid = flamePixels[animFrame];
  const startX = x - 5;
  const startY = y - 7;
  for (let r = 0; r < grid.length; r++) {
    for (let c = 0; c < grid[r].length; c++) {
      const ch = grid[r][c];
      if (ch === 'Y') ctx.fillStyle = "#FFFF44";
      else if (ch === 'O') ctx.fillStyle = "#FF8800";
      else if (ch === 'R') ctx.fillStyle = "#DD2200";
      else continue;
      ctx.fillRect(startX + c, startY + r, 1, 1);
    }
  }

  const glowRadius = 14 + Math.sin(frame * 0.3) * 2;
  ctx.fillStyle = "rgba(255, 170, 40, 0.08)";
  ctx.fillRect(x - glowRadius, y - glowRadius, glowRadius * 2, glowRadius * 2);
}

// 2. The Mahogany Bookshelf Vault (x = 345, y = 46)
// 4 Shelves x 6 Books = 24 Book Slots.
// CRITICAL DIRECTIVE: Shelf 2, Book 3 (s = 1, b = 2) is pulled in Act 4 and MUST REMAIN VISIBLY EMPTY!
function drawBookshelf(frame) {
  const sx = 345;
  const sy = 46;
  const sw = 125;
  const sh = 160;

  // Outer mahogany frame
  ctx.fillStyle = PALETTE.woodDark;
  ctx.fillRect(sx, sy, sw, sh);
  ctx.fillStyle = PALETTE.woodMid;
  ctx.fillRect(sx + 3, sy + 3, sw - 6, sh - 6);

  // Vault Header
  ctx.fillStyle = PALETTE.woodHighlight;
  ctx.fillRect(sx + 2, sy + 2, sw - 4, 14);
  ctx.fillStyle = PALETTE.hudGold;
  ctx.fillRect(sx + 6, sy + 5, 3, 3);
  ctx.fillRect(sx + sw - 9, sy + 5, 3, 3);

  // Vault Apex Crystal
  const crystalGlow = (frame >= 210 && frame < 450) || (frame >= 900);
  ctx.fillStyle = crystalGlow ? PALETTE.magicCyan : PALETTE.hudGold;
  ctx.fillRect(sx + Math.floor(sw / 2) - 4, sy - 4, 8, 8);
  ctx.fillStyle = "#FFFFFF";
  ctx.fillRect(sx + Math.floor(sw / 2) - 2, sy - 2, 4, 4);

  // Vault Title
  drawBitmapText("SKILL VAULT", sx + 26, sy + 6, PALETTE.hudGold, 1);

  // 4 Shelves
  const shelfCount = 4;
  const shelfH = 32;

  for (let s = 0; s < shelfCount; s++) {
    const shelfY = sy + 18 + s * 34;
    // Dark shelf interior recess
    ctx.fillStyle = "#150C07";
    ctx.fillRect(sx + 6, shelfY, sw - 12, shelfH - 4);

    // Shelf wooden plank
    ctx.fillStyle = PALETTE.woodHighlight;
    ctx.fillRect(sx + 4, shelfY + shelfH - 4, sw - 8, 4);
    ctx.fillStyle = PALETTE.woodDark;
    ctx.fillRect(sx + 4, shelfY + shelfH, sw - 8, 1);

    // Gold trim on shelf front edge
    ctx.fillStyle = PALETTE.hudGold;
    ctx.fillRect(sx + 8, shelfY + shelfH - 2, sw - 16, 1);

    // 6 Book slots per shelf
    for (let b = 0; b < 6; b++) {
      const slotGlobalIdx = s * 6 + b;
      const bx = sx + 10 + b * 18;
      const by = shelfY + 5;
      const bookHeight = 21 - (b % 3) * 2;

      // In Act 2/3, slots fill as badges arrive (frame 270 to 380)
      const fillThreshold = 270 + slotGlobalIdx * 4.5;
      const isFilled = frame >= fillThreshold;

      // CRITICAL DETAIL: In Act 4 (frame >= 900), Shelf 2, Book 3 (s = 1, b = 2) is PULLED!
      // That exact slot MUST BE SHOWN EMPTY (visible gap with dark outline) throughout Act 4!
      const isTargetSlotPulled = (frame >= 900 && s === 1 && b === 2);

      if (isTargetSlotPulled) {
        // Deep empty gap where the book was pulled
        ctx.fillStyle = "#0A0503";
        ctx.fillRect(bx, by, 14, 23);

        // Faint empty slot outline
        ctx.fillStyle = "rgba(241, 196, 15, 0.4)";
        ctx.fillRect(bx, by, 14, 1);
        ctx.fillRect(bx, by + 22, 14, 1);
        ctx.fillRect(bx, by, 1, 23);
        ctx.fillRect(bx + 13, by, 1, 23);

        // Dusty shelf shadow at the base of the empty slot
        ctx.fillStyle = "#180C07";
        ctx.fillRect(bx + 1, by + 18, 12, 4);
      } else if (isFilled) {
        // Shelf 2, Book 3 special golden spine when seated
        const isTargetSpecialBook = (s === 1 && b === 2);
        const bookColors = ["#3498DB", "#2ECC71", "#E74C3C", "#9B59B6", "#F39C12", "#1ABC9C"];
        const bCol = isTargetSpecialBook ? "#F1C40F" : bookColors[(s * 6 + b) % bookColors.length];

        const bookTop = by + (shelfH - 4 - bookHeight - 5);
        ctx.fillStyle = bCol;
        ctx.fillRect(bx, bookTop, 13, bookHeight);

        // Gold spine embossing
        ctx.fillStyle = isTargetSpecialBook ? "#FFFFFF" : PALETTE.hudGold;
        ctx.fillRect(bx + 2, bookTop + 3, 9, 2);
        ctx.fillRect(bx + 3, bookTop + 8, 7, 1);
        ctx.fillRect(bx + 2, bookTop + bookHeight - 4, 9, 1);

        // White locking flash when badge slides into slot
        const flashAge = frame - fillThreshold;
        if (flashAge >= 0 && flashAge < 8) {
          ctx.fillStyle = "#FFFFFF";
          ctx.fillRect(bx - 2, by - 2, 17, shelfH);
        }
      } else {
        // Empty slot prior to indexing
        ctx.fillStyle = "#1E120A";
        ctx.fillRect(bx, by + 10, 12, 12);
      }
    }
  }

  // Vault settling magical golden border aura (frames 390 to 450)
  if (frame >= 390 && frame < 450) {
    const auraAlpha = Math.sin((frame - 390) / 60 * Math.PI) * 0.45;
    ctx.strokeStyle = `rgba(241, 196, 15, ${auraAlpha})`;
    ctx.lineWidth = 2;
    ctx.strokeRect(sx - 2, sy - 2, sw + 4, sh + 4);
  }
}

// 3. Authentic Claude Mascot Sprite Renderer (16x10 Native Grid at 3x scale)
function drawClaudeMascot(cx, cy, state, hatAngle = 0, scaleX = 1.0, scaleY = 1.0, eyeState = "open", wandGlow = false) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(scaleX, scaleY);

  const PIXEL_SCALE = 3;

  let grid = [
    "..############..", // 0
    "..############..", // 1
    "..##E######E##..", // 2
    "..##E######E##..", // 3
    "AA############AA", // 4
    "AA############AA", // 5
    "..############..", // 6
    "..############..", // 7
    "...L.L....L.L...", // 8
    "...L.L....L.L..."  // 9
  ];

  if (state === "cast") {
    // Both arms raised high casting!
    grid[2] = "A.##E######E##.A";
    grid[3] = "AA##E######E##AA";
    grid[4] = "..############..";
    grid[5] = "..############..";
  } else if (state === "point_wand") {
    // Facing rightward, right arm raised pointing wand at Bookshelf Vault!
    grid[2] = "..##E######E##.A";
    grid[3] = "..##E######E##AA";
    grid[4] = "AA############..";
    grid[5] = "AA############..";
  } else if (state === "holding_book") {
    // Both hands forward holding the glowing book
    grid[4] = "..############..";
    grid[5] = ".A############A.";
  } else if (state === "victory") {
    grid[2] = "..##E######E##.A";
    grid[3] = "..##E######E##AA";
    grid[4] = "AA############..";
    grid[5] = "AA############..";
  } else if (state === "crouch") {
    grid[8] = "..L..L....L..L..";
    grid[9] = ".L....L..L....L.";
  } else if (state === "jump") {
    grid[8] = "....L......L....";
    grid[9] = "....L......L....";
  }

  const xOffset = -8 * PIXEL_SCALE;
  const yOffset = -10 * PIXEL_SCALE;

  for (let r = 0; r < 10; r++) {
    for (let c = 0; c < 16; c++) {
      const ch = grid[r][c];
      const px = xOffset + c * PIXEL_SCALE;
      const py = yOffset + r * PIXEL_SCALE;

      if (ch === '#' || ch === 'A' || ch === 'L') {
        if (r === 0 || (r === 4 && (c < 2 || c > 13))) {
          ctx.fillStyle = PALETTE.terracottaHighlight;
        } else if (r >= 6) {
          ctx.fillStyle = PALETTE.terracottaShadow;
        } else {
          ctx.fillStyle = PALETTE.terracotta;
        }
        ctx.fillRect(px, py, PIXEL_SCALE, PIXEL_SCALE);
      } else if (ch === 'E') {
        if (eyeState === "open") {
          ctx.fillStyle = "#180C14";
          ctx.fillRect(px, py, PIXEL_SCALE, PIXEL_SCALE);
        } else if (eyeState === "blink") {
          ctx.fillStyle = PALETTE.terracotta;
          ctx.fillRect(px, py, PIXEL_SCALE, PIXEL_SCALE);
        } else if (eyeState === "wink") {
          if (c === 4) {
            ctx.fillStyle = "#180C14";
            ctx.fillRect(px, py, PIXEL_SCALE, PIXEL_SCALE);
          } else {
            if (r === 2) {
              ctx.fillStyle = "#180C14";
              ctx.fillRect(px, py, PIXEL_SCALE, PIXEL_SCALE);
            } else {
              ctx.fillStyle = PALETTE.terracotta;
              ctx.fillRect(px, py, PIXEL_SCALE, PIXEL_SCALE);
            }
          }
        } else if (eyeState === "panic") {
          // Wide white sclera with small pupil looking rightward at avalanche
          ctx.fillStyle = "#FFFFFF";
          ctx.fillRect(px, py, PIXEL_SCALE, PIXEL_SCALE);
          ctx.fillStyle = "#180C14";
          ctx.fillRect(px + 1, py + 1, 2, 2);
        } else if (eyeState === "glow_cyan") {
          // Radiant glowing cyan eyes for spell targeting
          ctx.fillStyle = PALETTE.magicCyan;
          ctx.fillRect(px - 1, py - 1, PIXEL_SCALE + 2, PIXEL_SCALE + 2);
          ctx.fillStyle = "#FFFFFF";
          ctx.fillRect(px, py, PIXEL_SCALE, PIXEL_SCALE);
        }
      }
    }
  }

  // Panic Sweat Droplets (flying backwards and dripping down in horror)
  if (state === "panic") {
    ctx.fillStyle = "#64C8FF";
    ctx.fillRect(xOffset - 6, yOffset + 2, 2, 3);
    ctx.fillRect(xOffset - 10, yOffset - 4, 3, 3);
    ctx.fillRect(xOffset - 14, yOffset - 8, 2, 2);
    ctx.fillRect(xOffset - 8, yOffset + 12, 2, 3);
    ctx.fillStyle = "#FFFFFF";
    ctx.fillRect(xOffset - 9, yOffset - 3, 1, 1);
  }

  // Floppy Wizard Hat (equipped only from frame 210 onwards)
  const hasHat = (state === "wizard" || state === "cast" || state === "point_wand" || 
                  state === "holding_book" || state === "open_book" || state === "victory");
  if (hasHat) {
    drawFloppyWizardHat(0, yOffset, hatAngle, PIXEL_SCALE);
  }

  // Magic Wand
  if (state === "cast" || state === "point_wand" || state === "victory") {
    const wandBaseX = xOffset + 15 * PIXEL_SCALE;
    const wandBaseY = yOffset + (state === "point_wand" ? 2 : -2);
    
    // Wand shaft
    ctx.fillStyle = "#7A3D1B";
    ctx.fillRect(wandBaseX, wandBaseY - 6, 2, 8);

    // Wand glowing tip
    const wandColor = wandGlow ? PALETTE.magicCyan : PALETTE.hudGold;
    ctx.fillStyle = wandColor;
    ctx.fillRect(wandBaseX - 1, wandBaseY - 9, 4, 4);
    ctx.fillStyle = "#FFFFFF";
    ctx.fillRect(wandBaseX, wandBaseY - 8, 2, 2);

    // Sparkles radiating from wand
    if (wandGlow || state === "cast") {
      ctx.fillStyle = PALETTE.magicCyan;
      ctx.fillRect(wandBaseX + 4, wandBaseY - 11, 2, 2);
      ctx.fillRect(wandBaseX - 3, wandBaseY - 11, 2, 2);
      ctx.fillRect(wandBaseX + 5, wandBaseY - 7, 1, 1);
    }
  }

  ctx.restore();
}

function drawFloppyWizardHat(hx, hy, hatAngle, scale) {
  ctx.save();
  ctx.translate(hx, hy);

  // Hat Rim
  ctx.fillStyle = PALETTE.hudGold;
  ctx.fillRect(-8 * scale, -1 * scale, 16 * scale, 1 * scale);

  // Hat Cone Base
  ctx.fillStyle = PALETTE.magicPurple;
  ctx.fillRect(-6 * scale, -3 * scale, 12 * scale, 2 * scale);
  ctx.fillRect(-4 * scale, -5 * scale, 8 * scale, 2 * scale);

  // Floppy Tip with Secondary Rotation
  ctx.save();
  ctx.translate(0, -5 * scale);
  ctx.rotate(hatAngle);

  ctx.fillStyle = PALETTE.magicPurpleLight;
  ctx.fillRect(-3 * scale, -3 * scale, 6 * scale, 3 * scale);
  ctx.fillRect(-2 * scale, -5 * scale, 4 * scale, 2 * scale);
  ctx.fillRect(-1 * scale, -7 * scale, 2 * scale, 2 * scale);

  // Golden Star
  ctx.fillStyle = PALETTE.hudGold;
  ctx.fillRect(-2 * scale, -9 * scale, 4 * scale, 2 * scale);
  ctx.fillRect(-1 * scale, -10 * scale, 2 * scale, 4 * scale);

  ctx.restore();
  ctx.restore();
}

// 5. Retro Terminal Box (Act 4 CLI Prompt)
function drawTerminalBox(x, y, w, h, frame, textProg) {
  ctx.save();

  // CRT shadow & terminal background
  ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
  ctx.fillRect(x + 2, y + 2, w, h);
  ctx.fillStyle = "#0A0D14";
  ctx.fillRect(x, y, w, h);

  // Terminal window borders
  ctx.fillStyle = "#2D3748";
  ctx.fillRect(x, y, w, 1);
  ctx.fillRect(x, y + h - 1, w, 1);
  ctx.fillRect(x, y, 1, h);
  ctx.fillRect(x + w - 1, y, 1, h);

  // Top title bar
  ctx.fillStyle = "#161B26";
  ctx.fillRect(x + 1, y + 1, w - 2, 11);
  
  // Retro Mac/Linux window buttons
  ctx.fillStyle = "#E74C3C"; ctx.fillRect(x + 5, y + 4, 4, 4);
  ctx.fillStyle = "#F1C40F"; ctx.fillRect(x + 12, y + 4, 4, 4);
  ctx.fillStyle = "#2ECC71"; ctx.fillRect(x + 19, y + 4, 4, 4);

  drawBitmapText("BASH - CLAUDE CLI", x + 28, y + 3, "#8A9BA8", 1);

  // CRT scanlines effect inside window
  for (let ly = y + 12; ly < y + h; ly += 2) {
    ctx.fillStyle = "rgba(0, 0, 0, 0.25)";
    ctx.fillRect(x + 1, ly, w - 2, 1);
  }

  // Syntax highlighted command prompt typing:
  // $ in green, claude in cyan, argument in white
  const fullCommand = `$ claude "Make my project's ui ux better"`;
  const charCount = Math.floor(clamp(textProg, 0, 1) * fullCommand.length);
  const cursor = (frame % 24 < 12) ? "█" : " ";

  let currentX = x + 8;
  const currentY = y + 18;

  if (charCount > 0) {
    const promptLen = Math.min(charCount, 2);
    drawBitmapText(fullCommand.substring(0, promptLen), currentX, currentY, "#2ECC71", 1);
    currentX += promptLen * 6;
  }
  if (charCount > 2) {
    const cmdLen = Math.min(charCount - 2, 7);
    drawBitmapText(fullCommand.substring(2, 2 + cmdLen), currentX, currentY, PALETTE.magicCyan, 1);
    currentX += cmdLen * 6;
  }
  if (charCount > 9) {
    const argLen = charCount - 9;
    drawBitmapText(fullCommand.substring(9, 9 + argLen), currentX, currentY, "#FFFFFF", 1);
    currentX += argLen * 6;
  }

  // Blinking cursor block
  drawBitmapText(cursor, currentX, currentY, PALETTE.magicCyan, 1);

  ctx.restore();
}

// 7. Open Spellbook with Brilliant Light Rays (Climax Frames 1200 to 1320)
function drawOpenSpellbookRays(bx, by, frame, intensity = 1.0) {
  ctx.save();
  ctx.translate(bx, by);

  const rayCount = 16;
  const maxRadius = 380;
  const baseAngle = frame * 0.035;

  ctx.globalAlpha = clamp(intensity * 0.65, 0, 1);
  for (let i = 0; i < rayCount; i++) {
    const angle = baseAngle + (i * Math.PI * 2) / rayCount;
    const halfWidth = 0.12;

    const x1 = Math.cos(angle - halfWidth) * maxRadius;
    const y1 = Math.sin(angle - halfWidth) * maxRadius;
    const x2 = Math.cos(angle + halfWidth) * maxRadius;
    const y2 = Math.sin(angle + halfWidth) * maxRadius;

    const colors = ["#FFFFFF", PALETTE.magicCyan, PALETTE.hudGold];
    ctx.fillStyle = colors[i % colors.length];

    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.closePath();
    ctx.fill();
  }

  // Open Grimoire Book Core
  ctx.globalAlpha = 1.0;
  const bw = 32;
  const bh = 18;
  ctx.fillStyle = "#8C1C30";
  ctx.fillRect(-bw / 2, -bh / 2, bw, bh);

  ctx.fillStyle = "#F5F0DC";
  ctx.fillRect(-bw / 2 + 2, -bh / 2 + 2, bw / 2 - 3, bh - 4);
  ctx.fillRect(1, -bh / 2 + 2, bw / 2 - 3, bh - 4);

  ctx.fillStyle = PALETTE.hudGold;
  ctx.fillRect(-1, -bh / 2, 2, bh);

  // Brilliant core star
  ctx.fillStyle = "#FFFFFF";
  ctx.fillRect(-4, -4, 8, 8);
  ctx.fillStyle = PALETTE.magicCyan;
  ctx.fillRect(-2, -2, 4, 4);

  ctx.restore();
}

function drawBitmapText(str, startX, startY, color = "#FFFFFF", scale = 1, lineSpacing = 10) {
  ctx.fillStyle = color;
  let cursorX = startX;
  let cursorY = startY;

  for (let i = 0; i < str.length; i++) {
    const ch = str[i];
    if (ch === '\n') {
      cursorY += lineSpacing * scale;
      cursorX = startX;
      continue;
    }
    const glyph = BITMAP_FONT[ch] || BITMAP_FONT[ch.toUpperCase()] || BITMAP_FONT[' '];
    for (let r = 0; r < 7; r++) {
      const rowBits = glyph[r];
      for (let c = 0; c < 5; c++) {
        if ((rowBits >> (4 - c)) & 1) {
          ctx.fillRect(cursorX + c * scale, cursorY + r * scale, scale, scale);
        }
      }
    }
    cursorX += 6 * scale;
  }
}

// MASTER ANIMATION TIMELINE (1,320 frames = 22.000s at 60 FPS)
// ============================================================================
window.renderFrame = function(frameIndex, totalFrames = 1320) {
  const frame = clamp(frameIndex, 0, totalFrames - 1);

  ctx.fillStyle = PALETTE.bgDark;
  ctx.fillRect(0, 0, NATIVE_W, NATIVE_H);

  // Dynamic Screen Shake on heavy badge avalanche impacts (frames 25 to 140)
  let shakeX = 0;
  let shakeY = 0;
  if (frame >= 25 && frame <= 140) {
    const intensity = Math.sin(((frame - 25) / 115) * Math.PI) * 2.2;
    shakeX = (Math.sin(frame * 1.8) * 1.2 + Math.cos(frame * 3.4) * 0.8) * intensity;
    shakeY = (Math.cos(frame * 2.1) * 1.0 + Math.sin(frame * 2.9) * 0.6) * intensity;
  }
  ctx.save();
  ctx.translate(shakeX, shakeY);

  // 1. Draw Dungeon Room Background & Torches
  drawDungeonBackground(frame);

  // 2. Draw Bookshelf (x = 345, y = 46)
  drawBookshelf(frame);

  // 3. Mascot Physics & State Machine
  // CRITICAL: Position Claude on the left: x = 110, y = 205 (on the ground).
  let mascotX = 110;
  let mascotY = 205;
  let mascotState = "idle";
  let eyeState = "open";
  let mascotScaleX = 1.0;
  let mascotScaleY = 1.0;
  let hatAngle = 0.0;
  let wandGlow = false;
  let contextUsage = 15;

  // ACT 1: Falling Skills & Claude Shock (Frames 0 to 150)
  if (frame < 150) {
    if (frame < 15) {
      mascotState = "idle";
      mascotY += Math.sin(frame * 0.1) * 0.8;
      contextUsage = 15;
    } else {
      // Avalanche in progress! Claude recoils in shock/panic looking rightward
      const shockProg = clamp((frame - 15) / 120, 0, 1);
      contextUsage = Math.floor(lerp(15, 98, shockProg));

      mascotState = "panic";
      eyeState = "panic"; // wide panic eyes looking rightward at avalanche
      // Jittering / trembling in shock
      mascotX = 110 + (Math.sin(frame * 2.5) * 1.4);
      mascotY = 205 + (Math.cos(frame * 3.1) * 0.6);
      mascotScaleX = 1.0 + shockProg * 0.15;
      mascotScaleY = 1.0 - shockProg * 0.12;
    }
  } 
  // ACT 2: Floppy Wizard Hat Descends & Anticipation Jump (Frames 150 to 210)
  else if (frame < 210) {
    contextUsage = 98;
    if (frame < 170) {
      // Standing looking up in awe
      mascotState = "idle";
      eyeState = "open";
    } else if (frame < 190) {
      // Anticipation crouch (frames 170-190)
      mascotState = "crouch";
      eyeState = "open";
      mascotScaleX = 1.25;
      mascotScaleY = 0.72;
    } else {
      // Leap up with stretch (frames 190-210) to equip the hat
      const leapT = (frame - 190) / 20.0;
      mascotY = lerp(205, 135, easeOutQuad(leapT));
      mascotScaleX = 0.82;
      mascotScaleY = 1.28;
      mascotState = "jump";
      hatAngle = -0.3;
    }
  }
  // ACT 3: Hat Equips, Wizard Hover, Spell Casting & Vortex (Frames 210 to 450)
  else if (frame < 450) {
    if (frame < 390) {
      // Claude casting spell with arms raised and waving wand
      mascotState = "cast";
      eyeState = "open";
      mascotY = 135 + Math.sin(frame * 0.08) * 3.0;
      hatAngle = Math.sin(frame * 0.15) * 0.22;
      wandGlow = true;

      // Context meter drops rapidly from 98% -> 2% [OPTIMAL]
      const dropProg = clamp((frame - 230) / 150, 0, 1);
      contextUsage = Math.floor(lerp(98, 2, easeInOutQuad(dropProg)));
    } else {
      // Frames 390-450: Shelves locked in, vault aura settles
      mascotState = "wizard";
      eyeState = "open";
      mascotY = 135 + Math.sin(frame * 0.06) * 2.0;
      hatAngle = Math.sin(frame * 0.08) * 0.12;
      contextUsage = 2;
    }
  }
  // ACT 3.5: RPG Results Popup (Frames 450 to 750)
  else if (frame < 750) {
    // Claude floating proudly on the left side of popup
    mascotX = 75;
    mascotY = 145 + Math.sin(frame * 0.06) * 1.5;
    mascotState = "victory";
    eyeState = (frame % 80 < 25) ? "wink" : "open";
    hatAngle = Math.sin(frame * 0.06) * 0.1;
    contextUsage = 2;
  }
  // ACT 4: Interactive Ending - Terminal Typing (Frames 750 to 900)
  else if (frame < 900) {
    // Claude descends / hovers gently at x = 110, y = 180
    const descT = clamp((frame - 750) / 40, 0, 1);
    mascotY = lerp(145, 180, easeOutQuad(descT)) + Math.sin(frame * 0.06) * 1.2;
    mascotState = "wizard";
    eyeState = "open";
    hatAngle = Math.sin(frame * 0.06) * 0.1;
    contextUsage = 2;
  }
  // ACT 4: Claude Points Wand, Book Retrieves from Empty Shelf (Frames 900 to 1050)
  else if (frame < 1050) {
    mascotY = 180 + Math.sin(frame * 0.07) * 1.5;
    mascotState = "point_wand"; // Right arm pointing wand at Bookshelf Vault!
    eyeState = "glow_cyan"; // Wizard eyes light up with cyan glow / sparkle
    hatAngle = -0.15 + Math.sin(frame * 0.12) * 0.08;
    wandGlow = true;
    contextUsage = 2;
  }
  // ACT 4: Book Arrives in Hand & Activation Banner (Frames 1050 to 1200)
  else if (frame < 1200) {
    mascotY = 180 + Math.sin(frame * 0.06) * 1.2;
    mascotState = "holding_book"; // Holding glowing book in both hands
    eyeState = "open";
    hatAngle = Math.sin(frame * 0.06) * 0.1;
    contextUsage = 2;
  }
  // ACT 4: Book Opens Facing Forward & Radiant Light Rays (Frames 1200 to 1320)
  else {
    mascotY = 180 + Math.sin(frame * 0.05) * 1.0;
    mascotState = "open_book"; // Front facing open book
    eyeState = "glow_cyan";
    hatAngle = 0.0;
    contextUsage = 2;
  }

  // Draw Floppy Wizard Hat descending from top in Act 2 (frames 150 to 210)
  if (frame >= 150 && frame < 210) {
    const hatProg = clamp((frame - 150) / 60, 0, 1);
    const hatDescY = lerp(-35, 135 - 30, easeOutQuad(hatProg));
    drawFloppyWizardHat(110, hatDescY, Math.sin(frame * 0.1) * 0.2, 3);
  }

  // Magical Purple Burst Particle Ring at frame 210 (#6C3483, #A569BD, #F1C40F, #00F0FF)
  if (frame >= 210 && frame < 245) {
    const burstAge = (frame - 210);
    const radius = burstAge * 3.8;
    const ringCount = 20;
    const ringColors = ["#6C3483", "#A569BD", "#F1C40F", "#00F0FF"];

    for (let r = 0; r < ringCount; r++) {
      const angle = (r * Math.PI * 2) / ringCount;
      const px = 110 + Math.cos(angle) * radius;
      const py = 135 + Math.sin(angle) * radius;
      ctx.fillStyle = ringColors[r % ringColors.length];
      ctx.fillRect(Math.floor(px) - 1, Math.floor(py) - 1, 3, 3);
    }
  }

  // Pulsing Magic Summoning Circle beneath Claude during Act 3 Casting
  if (frame >= 210 && frame < 390) {
    ctx.save();
    ctx.strokeStyle = "rgba(0, 240, 255, 0.45)";
    ctx.lineWidth = 1;
    const ringRadius = 26 + Math.sin(frame * 0.15) * 4;
    ctx.strokeRect(mascotX - ringRadius, 205 - 5, ringRadius * 2, 10);
    ctx.strokeStyle = "rgba(241, 196, 15, 0.35)";
    ctx.strokeRect(mascotX - ringRadius * 0.7, 205 - 3, ringRadius * 1.4, 6);
    ctx.restore();
  }

  // Draw Badges: Act 1 Avalanche Drop -> Chaotic Pile -> Act 3 Vortex into Vault
  BADGES.forEach((b) => {
    // Before drop start, not visible
    if (frame < b.dropStart) return;

    // Act 1 & 2: Falling with gravity and settled in towering pile
    if (frame < b.spiralStart) {
      const dt = (frame - b.dropStart) / 60.0;
      const g = 850.0;
      const targetY = b.pileY;

      let curY = b.startY + 0.5 * g * dt * dt;
      let rot = b.pileRot;
      let bScaleX = 1.0;
      let bScaleY = 1.0;

      if (curY >= targetY) {
        const timeToFloor = Math.sqrt((2 * (targetY - b.startY)) / g);
        const postImpactDt = dt - timeToFloor;
        const vImpact = g * timeToFloor;
        const vBounce = vImpact * 0.38;

        if (postImpactDt < 0.22) {
          const bounceY = targetY - (vBounce * postImpactDt - 0.5 * g * postImpactDt * postImpactDt);
          curY = Math.min(targetY, bounceY);
          bScaleX = 1.25;
          bScaleY = 0.78;
        } else {
          curY = targetY;
          rot = b.pileRot;
        }
      } else {
        bScaleX = 0.88;
        bScaleY = 1.15;
      }

      drawRetroBadge(b.name, b.startX, curY, rot, b.color, bScaleX, bScaleY);
    } 
    // Act 3: 3D Centripetal Vortex Swirling into the Bookshelf Vault
    // Swirling path is strictly maintained between x = 230 and 420
    else if (frame < 450) {
      const vortexT = (frame - b.spiralStart) / 65.0;
      if (vortexT < 1.0) {
        const easeT = easeInCubic(vortexT);
        const vaultTargetX = 345 + 10 + (b.shelfSlotIndex % 6) * 18;
        const vaultTargetY = 46 + 18 + Math.floor(b.shelfSlotIndex / 6) * 34 + 10;

        const vortexCenterX = lerp(Math.max(250, b.startX), vaultTargetX, easeT);
        const vortexCenterY = lerp(b.pileY, vaultTargetY, easeT);

        const initRadius = 75 + b.seed * 35;
        const curRadius = initRadius * (1.0 - easeT);
        const angle = b.seed * 6.28 + vortexT * (Math.PI * 6.0);

        const bx = vortexCenterX + Math.cos(angle) * curRadius;
        const by = vortexCenterY + Math.sin(angle) * (curRadius * 0.42);
        const rot = angle + Math.PI / 2;
        const scale = 1.0 - easeT * 0.65;

        drawRetroBadge(b.name, bx, by, rot, b.color, scale, scale, 1.0 - easeT * 0.15);
      }
    }
  });

  // 4. Draw Mascot (Claude)
  drawClaudeMascot(mascotX, mascotY, mascotState, hatAngle, mascotScaleX, mascotScaleY, eyeState, wandGlow);

  // 5. Act 4: Retro Terminal Box (Frames 750 to 900)
  if (frame >= 750 && frame < 900) {
    const textProg = (frame - 780) / 100.0;
    drawTerminalBox(48, 32, 275, 48, frame, textProg);
  }

  // 6. Act 4: Golden Book [UI-UX-PRO-MAX] Retrieval with Harmonic Spring Physics
  // Shelf 2, Book 3 starts at (391, 103) and harmonic travels to Claude's hand at (128, 172)
  if (frame >= 900 && frame < 1050) {
    const targetHandX = 128;
    const targetHandY = 172;
    const shelfSourceX = 391;
    const shelfSourceY = 103;

    if (frame < 920) {
      // Glow and pulse in slot before leaving
      const pulseGlow = Math.sin((frame - 900) * 0.3) * 0.4 + 0.6;
      ctx.fillStyle = `rgba(241, 196, 15, ${pulseGlow})`;
      ctx.fillRect(shelfSourceX - 2, shelfSourceY - 2, 17, 24);
    } else {
      // Traveling with Harmonic Spring Physics & Arc
      const t = clamp((frame - 920) / 120.0, 0, 1);
      const springT = getSpringProgress(t, 0.65, 5.5);
      const arcY = -Math.sin(t * Math.PI) * 38; // Upward buoyant arc

      const curBookX = lerp(shelfSourceX, targetHandX, springT);
      const curBookY = lerp(shelfSourceY, targetHandY, springT) + arcY;
      const bookRot = Math.sin(t * Math.PI) * -0.22;

      // Golden particle trail left in wake
      for (let tr = 0; tr < 3; tr++) {
        const trailX = curBookX + (seededRandom(frame * 3 + tr) - 0.5) * 14;
        const trailY = curBookY + (seededRandom(frame * 5 + tr) - 0.5) * 10;
        ctx.fillStyle = (tr % 2 === 0) ? PALETTE.hudGold : PALETTE.magicCyan;
        ctx.fillRect(Math.floor(trailX), Math.floor(trailY), 2, 2);
      }

      drawFloatingBook(curBookX, curBookY, frame, 1.0, bookRot);
    }
  }

  // 7. Act 4: Book in Claude's Hand & Activated HUD Banner (Frames 1050 to 1200)
  if (frame >= 1050 && frame < 1200) {
    drawFloatingBook(128, 174, frame, 0.9, 0.05);
    drawActivationBanner(55, 88, 265, 26, frame);
  }

  // 8. Act 4 Climax: Book Opens with Radiant Magic Light Rays (Frames 1200 to 1320)
  if (frame >= 1200) {
    const rayIntensity = clamp((frame - 1200) / 60, 0, 1);
    drawOpenSpellbookRays(128, 174, frame, rayIntensity);
  }

  // 9. Ambient & Celebration Particles
  PARTICLES.forEach((p, pi) => {
    const py = (p.y - frame * p.speed) % NATIVE_H;
    const px = (p.x + Math.sin(frame * 0.05 + pi) * 10) % NATIVE_W;
    ctx.fillStyle = p.color;
    ctx.fillRect(Math.floor(px), Math.floor((py < 0) ? py + NATIVE_H : py), p.size, p.size);
  });

  // Confetti in Act 3.5 Victory Celebration (Frames 450 to 750)
  if (frame >= 450 && frame < 750) {
    const victoryAge = frame - 450;
    CONFETTI.forEach((c, ci) => {
      const cy = ((victoryAge * c.speed + c.yOffset) % (NATIVE_H + 20)) - 10;
      const cx = c.x + Math.sin(victoryAge * 0.05 + ci) * 12;
      ctx.fillStyle = c.color;
      ctx.fillRect(Math.floor(cx), Math.floor(cy), 2, 2);
    });
  }

  // 10. RPG Results Popup (Frames 450 to 750)
  // Positioned at x = 135 to leave Claude visible and proud on the left (x = 75)
  if (frame >= 450 && frame < 750) {
    let popupScale = 1.0;
    if (frame < 470) {
      popupScale = easeOutCubic((frame - 450) / 20);
    } else if (frame > 730) {
      popupScale = 1.0 - easeInQuad((frame - 730) / 20);
    }
    
    ctx.save();
    ctx.translate(300, 128);
    ctx.scale(popupScale, popupScale);
    drawRPGResultsPopup(-165, -72, 330, 144, frame);
    ctx.restore();
  }

  // 11. Top RPG HUD
  drawTopHUD(frame, contextUsage, contextUsage > 80);

  ctx.restore();

  // 12. RADIANT BLOOM & FULL SCREEN WHITEOUT (Frames 1260 to 1319) & SEAMLESS LOOP FADE (0 to 20)
  // Radiant bloom starts at frame 1260 (21.0s) and builds smoothly to pure full-screen whiteout at frame 1319 (22.0s)
  if (frame >= 1260) {
    const whiteoutProg = clamp((frame - 1260) / 59.0, 0, 1);

    // Radiant expanding flare gradient
    const flareR = whiteoutProg * NATIVE_W * 1.2;
    const grad = ctx.createRadialGradient(128, 174, 5, 128, 174, Math.max(10, flareR));
    grad.addColorStop(0, "rgba(255, 255, 255, 1.0)");
    grad.addColorStop(0.3, `rgba(0, 240, 255, ${whiteoutProg * 0.7})`);
    grad.addColorStop(0.6, `rgba(241, 196, 15, ${whiteoutProg * 0.5})`);
    grad.addColorStop(1, `rgba(255, 255, 255, ${whiteoutProg})`);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, NATIVE_W, NATIVE_H);

    // Pure brilliant whiteout layer building to 100% white at frame 1319
    const pureWhiteAlpha = easeInQuad(whiteoutProg);
    ctx.fillStyle = `rgba(255, 255, 255, ${pureWhiteAlpha})`;
    ctx.fillRect(0, 0, NATIVE_W, NATIVE_H);
  }

  // Seamless Loop: Fade in from pure white at Frame 0 to 20
  if (frame < 20) {
    const fadeInWhite = 1.0 - clamp(frame / 20.0, 0, 1);
    if (fadeInWhite > 0) {
      ctx.fillStyle = `rgba(255, 255, 255, ${fadeInWhite})`;
      ctx.fillRect(0, 0, NATIVE_W, NATIVE_H);
    }
  }

  // 13. NEAREST-NEIGHBOR UPSCALE TO 1920x1080 DISPLAY CANVAS
  displayCtx.imageSmoothingEnabled = false;
  displayCtx.drawImage(offscreen, 0, 0, 1920, 1080);
};

// Safe browser animation loop
window.IS_HEADLESS = false;
let animId = null;
let currentFrame = 0;
function animate() {
  if (window.IS_HEADLESS) return;
  window.renderFrame(currentFrame, TOTAL_FRAMES);
  currentFrame = (currentFrame + 1) % TOTAL_FRAMES;
  animId = requestAnimationFrame(animate);
}
window.addEventListener('load', () => {
  if (!window.IS_HEADLESS) {
    animate();
  }
});
</script>
</body>
</html>
