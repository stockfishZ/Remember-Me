<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RememberMe v2 Launch Video</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #070709;
      color: #FFFFFF;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    #canvas {
      width: 1920px;
      height: 1080px;
      background: #070709;
      display: block;
    }
  </style>
</head>
<body>
<canvas id="canvas" width="1920" height="1080"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const TOTAL_FRAMES = 1320;
const FPS = 60;
const W = 1920;
const H = 1080;

// Easing math
const easeLinear = t => t;
const easeOutQuad = t => t * (2 - t);
const easeInQuad = t => t * t;
const easeInOutQuad = t => t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
const easeOutCubic = t => (--t) * t * t + 1;
const easeInCubic = t => t * t * t;
const easeInOutCubic = t => t < 0.5 ? 4 * t * t * t : (t - 1) * (2 * t - 2) * (2 * t - 2) + 1;
const easeOutBack = (t, s = 1.70158) => (--t) * t * ((s + 1) * t + s) + 1;
const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
const lerp = (a, b, t) => a + (b - a) * t;

// 60 Real Skill Badges from the catalog
const SKILL_NAMES = [
  "postgresql", "docker-expert", "react-patterns", "aws-audit", "grill-me", 
  "turborepo", "nextjs-app", "systematic-debugging", "graphql-api", "fastapi-py", 
  "redis-cache", "agent-memory", "prisma-expert", "clerk-auth", "stripe-billing", 
  "kubernetes", "tailwind-v4", "solidity-sec", "vite-bundler", "clickhouse-io", 
  "sentry-error", "playwright-e2e", "datadog-apm", "terraform-iac", "celery-worker", 
  "elasticsearch", "kafka-stream", "git-advanced", "pydantic-v2", "supabase-auth", 
  "mongodb-atlas", "zod-schema", "weaviate-rag", "langgraph-agent", "prompt-eng", 
  "jwt-security", "oauth2-sso", "vitest-tdd", "caddy-proxy", "nginx-reverse", 
  "bun-runtime", "cloudflare-workers", "dynamodb-nosql", "grpc-service", "websockets-sync", 
  "prometheus-kpi", "grafana-dash", "cypress-e2e", "pytest-runner", "pandas-data", 
  "pytorch-model", "huggingface-hub", "github-actions", "vault-secrets", "ansible-playbook", 
  "consul-mesh", "open-telemetry", "vector-index", "pinecone-db", "chroma-rag"
];

// Pre-compute skill item properties for deterministic rendering
const SKILLS = SKILL_NAMES.map((name, i) => {
  const hash = Math.sin(i * 997.13 + 12.34);
  const hash2 = Math.cos(i * 433.81 + 87.65);
  const hash3 = Math.sin(i * 123.45 + 56.78);
  
  // Starting position in Beat 1: raining down across the entire width
  const startX = 220 + Math.abs(hash) * 1480;
  // Staggered delays: first wave (0-60), intense avalanche wave (60-150)
  const delay = (i < 20) ? (i * 2.5) : (50 + (i - 20) * 1.8);
  const fallSpeed = 9 + Math.abs(hash3) * 14;
  
  // Piling up on the floor around Claude (x=960, y=820)
  const pileRow = Math.floor(i / 10);
  const pileCol = i % 10;
  const targetX = 540 + pileCol * 95 + (hash * 40);
  const targetY = 880 - pileRow * 28 - Math.abs(hash2) * 22;
  const rot = (hash * 0.45);
  
  const colors = ["#F97316", "#3B82F6", "#10B981", "#8B5CF6", "#EC4899", "#EAB308", "#06B6D4", "#F43F5E"];
  const color = colors[i % colors.length];
  
  return {
    name,
    startX,
    delay,
    fallSpeed,
    targetX,
    targetY,
    rot,
    color,
    index: i
  };
});

// Ambient floating particles
const PARTICLES = Array.from({ length: 65 }, (_, i) => ({
  x: Math.abs(Math.sin(i * 321.4)) * W,
  y: Math.abs(Math.cos(i * 654.3)) * H,
  size: 1 + Math.abs(Math.sin(i * 99.1)) * 2.2,
  speed: 0.2 + Math.abs(Math.cos(i * 77.2)) * 0.5,
  alpha: 0.15 + Math.abs(Math.sin(i * 44.5)) * 0.45
}));

// Draw Skill Badge Pill
function drawSkillBadge(name, x, y, rot, color, scale = 1.0, alpha = 1.0) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.scale(scale, scale);
  ctx.globalAlpha = clamp(alpha, 0, 1);

  const bw = 145;
  const bh = 34;

  // Badge Background & Glow
  ctx.fillStyle = "#18181B";
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.roundRect(-bw / 2, -bh / 2, bw, bh, 8);
  ctx.fill();
  ctx.stroke();

  // Category Dot
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(-bw / 2 + 14, 0, 5, 0, Math.PI * 2);
  ctx.fill();

  // Label
  ctx.fillStyle = "#F4F4F5";
  ctx.font = "bold 13px 'SF Mono', Consolas, monospace";
  ctx.textAlign = "left";
  ctx.textBaseline = "middle";
  const displayName = name.length > 13 ? name.substring(0, 12) + "…" : name;
  ctx.fillText(displayName, -bw / 2 + 26, 1);

  ctx.restore();
}

// Draw Mascot Helper
function drawMascot(cx, cy, scale, options = {}) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(scale, scale);

  const {
    eyes = 'normal', // 'normal', 'panic', 'closed', 'wink', 'magic'
    sweat = 0,
    hasHat = false,
    hatGlow = 0,
    armAngle = 0,
    typing = false,
    magicAntenna = false
  } = options;

  // Drop Shadow
  ctx.fillStyle = "rgba(0, 0, 0, 0.45)";
  ctx.beginPath();
  ctx.ellipse(0, 75, 45, 14, 0, 0, Math.PI * 2);
  ctx.fill();

  // Bot Feet
  ctx.fillStyle = "#9A3412";
  ctx.fillRect(-28, 62, 18, 12);
  ctx.fillRect(10, 62, 18, 12);

  // Bot Body (Terracotta Spark Bot)
  ctx.fillStyle = "#EA580C";
  ctx.beginPath();
  ctx.roundRect(-40, -10, 80, 75, 12);
  ctx.fill();

  // Chest panel
  ctx.fillStyle = "#C2410C";
  ctx.fillRect(-28, 15, 56, 38);
  ctx.fillStyle = "#FDBA74";
  ctx.fillRect(-20, 22, 12, 6);
  ctx.fillRect(-4, 22, 12, 6);
  ctx.fillRect(12, 22, 12, 6);

  // Bot Head
  ctx.fillStyle = "#F97316";
  ctx.beginPath();
  ctx.roundRect(-46, -65, 92, 60, 14);
  ctx.fill();

  // CRT Screen Face
  ctx.fillStyle = "#18181B";
  ctx.beginPath();
  ctx.roundRect(-38, -58, 76, 46, 8);
  ctx.fill();

  // Screen scanline highlight
  ctx.fillStyle = "rgba(255, 255, 255, 0.06)";
  ctx.fillRect(-38, -58, 76, 12);

  // Antenna
  ctx.strokeStyle = "#EA580C";
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(0, -65);
  ctx.lineTo(0, -84);
  ctx.stroke();

  // Antenna Spark Orb
  ctx.fillStyle = magicAntenna ? "#A855F7" : "#FBBF24";
  ctx.beginPath();
  ctx.arc(0, -88, 7, 0, Math.PI * 2);
  ctx.fill();
  if (magicAntenna) {
    ctx.fillStyle = "#C084FC";
    ctx.beginPath();
    ctx.arc(0, -88, 14, 0, Math.PI * 2);
    ctx.globalAlpha = 0.45;
    ctx.fill();
    ctx.globalAlpha = 1.0;
  }

  // Eyes rendering
  if (eyes === 'panic') {
    // Shocked wide eyes
    ctx.fillStyle = "#FFFFFF";
    ctx.fillRect(-26, -46, 18, 22);
    ctx.fillRect(8, -46, 18, 22);
    ctx.fillStyle = "#EF4444";
    const wobble = Math.sin(scale * 20) * 2;
    ctx.fillRect(-21 + wobble, -40, 8, 10);
    ctx.fillRect(13 + wobble, -40, 8, 10);
    // Shocked open mouth
    ctx.fillStyle = "#FFFFFF";
    ctx.fillRect(-8, -20, 16, 6);
  } else if (eyes === 'magic') {
    // Glowing emerald magical eyes
    ctx.fillStyle = "#34D399";
    ctx.shadowColor = "#10B981";
    ctx.shadowBlur = 14;
    ctx.fillRect(-25, -43, 16, 14);
    ctx.fillRect(9, -43, 16, 14);
    ctx.fillStyle = "#FFFFFF";
    ctx.fillRect(-21, -40, 6, 6);
    ctx.fillRect(13, -40, 6, 6);
    ctx.shadowBlur = 0;
    // Confident smile
    ctx.fillStyle = "#34D399";
    ctx.fillRect(-12, -22, 24, 4);
  } else if (eyes === 'wink') {
    // Left eye wink arc
    ctx.strokeStyle = "#FBBF24";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(-17, -35, 8, Math.PI, 0);
    ctx.stroke();
    // Right eye cheerful star
    ctx.fillStyle = "#FBBF24";
    ctx.beginPath();
    ctx.arc(17, -36, 7, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#FFFFFF";
    ctx.fillRect(15, -38, 4, 4);
    // Smile
    ctx.beginPath();
    ctx.arc(0, -22, 8, 0, Math.PI);
    ctx.fill();
  } else {
    // Normal friendly pixel eyes
    ctx.fillStyle = "#38BDF8";
    ctx.fillRect(-25, -42, 14, 14);
    ctx.fillRect(11, -42, 14, 14);
    ctx.fillStyle = "#FFFFFF";
    ctx.fillRect(-21, -40, 5, 5);
    ctx.fillRect(15, -40, 5, 5);
    // Cute smile
    ctx.fillStyle = "#38BDF8";
    ctx.fillRect(-8, -22, 16, 4);
  }

  // Sweat drops if panicked
  if (sweat > 0) {
    ctx.fillStyle = "rgba(56, 189, 248, 0.9)";
    const drop1Y = -60 - (sweat * 20);
    const drop2Y = -55 - (sweat * 25);
    ctx.beginPath();
    ctx.arc(46, drop1Y, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(-44, drop2Y, 6, 0, Math.PI * 2);
    ctx.fill();
  }

  // Arms
  ctx.fillStyle = "#EA580C";
  if (typing) {
    ctx.fillRect(-52, 10, 16, 32);
    ctx.fillRect(36, 10, 16, 32);
  } else if (armAngle !== 0) {
    // Raised spellcasting arm
    ctx.save();
    ctx.translate(36, 15);
    ctx.rotate(armAngle);
    ctx.fillRect(0, -8, 36, 16);
    // Hand
    ctx.fillStyle = "#FDBA74";
    ctx.beginPath();
    ctx.arc(36, 0, 9, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    ctx.fillRect(-52, 10, 16, 32);
  } else {
    ctx.fillRect(-52, 10, 16, 32);
    ctx.fillRect(36, 10, 16, 32);
  }

  // Wizard Hat
  if (hasHat) {
    drawWizardHat(0, -68, hatGlow);
  }

  ctx.restore();
}

function drawWizardHat(x, y, glow = 0) {
  ctx.save();
  ctx.translate(x, y);

  if (glow > 0) {
    ctx.shadowColor = "#8B5CF6";
    ctx.shadowBlur = 25 * glow;
  }

  // Brim
  ctx.fillStyle = "#6D28D9";
  ctx.beginPath();
  ctx.ellipse(0, 0, 58, 14, 0, 0, Math.PI * 2);
  ctx.fill();

  // Cone
  ctx.fillStyle = "#7C3AED";
  ctx.beginPath();
  ctx.moveTo(-36, -2);
  ctx.quadraticCurveTo(-15, -45, 12, -75);
  ctx.quadraticCurveTo(8, -40, 36, -2);
  ctx.closePath();
  ctx.fill();

  // Golden Ribbon
  ctx.fillStyle = "#F59E0B";
  ctx.beginPath();
  ctx.moveTo(-34, -4);
  ctx.quadraticCurveTo(0, 4, 34, -4);
  ctx.lineTo(32, -14);
  ctx.quadraticCurveTo(0, -6, -32, -14);
  ctx.closePath();
  ctx.fill();

  // Emerald Gem
  ctx.fillStyle = "#10B981";
  ctx.beginPath();
  ctx.arc(0, -6, 6, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#A7F3D0";
  ctx.fillRect(-2, -8, 3, 3);

  // Golden Stars
  ctx.fillStyle = "#FDE047";
  drawStar(-12, -32, 4, 5, 2);
  drawStar(6, -50, 3, 4, 1.5);

  ctx.restore();
}

function drawStar(cx, cy, spikes, outerRadius, innerRadius) {
  let rot = Math.PI / 2 * 3;
  let x = cx;
  let y = cy;
  let step = Math.PI / spikes;

  ctx.beginPath();
  ctx.moveTo(cx, cy - outerRadius);
  for (let i = 0; i < spikes; i++) {
    x = cx + Math.cos(rot) * outerRadius;
    y = cy + Math.sin(rot) * outerRadius;
    ctx.lineTo(x, y);
    rot += step;

    x = cx + Math.cos(rot) * innerRadius;
    y = cy + Math.sin(rot) * innerRadius;
    ctx.lineTo(x, y);
    rot += step;
  }
  ctx.lineTo(cx, cy - outerRadius);
  ctx.closePath();
  ctx.fill();
}

// Draw Bookshelf
function drawBookshelf(x, y, progress = 1.0) {
  ctx.save();
  ctx.translate(x, y);
  ctx.globalAlpha = clamp(progress, 0, 1);

  const shelfW = 440;
  const shelfH = 500;

  // Outer Mahogany Cabinet with rich border
  ctx.fillStyle = "#341B0E";
  ctx.strokeStyle = "#5C3317";
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.roundRect(-shelfW / 2, -shelfH / 2, shelfW, shelfH, 14);
  ctx.fill();
  ctx.stroke();

  // Inner Dark Backing
  ctx.fillStyle = "#1A0E08";
  ctx.fillRect(-shelfW / 2 + 16, -shelfH / 2 + 50, shelfW - 32, shelfH - 68);

  // Bookshelf Plaque
  ctx.fillStyle = "#6D28D9";
  ctx.strokeStyle = "#FBBF24";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.roundRect(-160, -shelfH / 2 + 10, 320, 32, 8);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = "#FDE047";
  ctx.font = "bold 14px -apple-system, sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("📚 INLINE SYSTEM RULES", 0, -shelfH / 2 + 26);

  // Shelves Lines & Bound Books
  const shelfCount = 4;
  for (let s = 1; s <= shelfCount; s++) {
    const sy = -shelfH / 2 + 50 + s * 100;
    ctx.fillStyle = "#5C3317";
    ctx.fillRect(-shelfW / 2 + 12, sy, shelfW - 24, 10);

    // Books populate
    if (progress > 0.25) {
      const booksInShelf = 15;
      const bProgress = clamp((progress - 0.25) / 0.75, 0, 1);
      const visibleBooks = Math.floor(booksInShelf * bProgress);
      
      for (let b = 0; b < visibleBooks; b++) {
        const bx = -shelfW / 2 + 25 + b * 26;
        const bHeight = 70 + ((b * 11 + s * 7) % 20);
        const bookColors = ["#DC2626", "#2563EB", "#059669", "#7C3AED", "#D97706", "#DB2777", "#0891B2"];
        ctx.fillStyle = bookColors[(b * 3 + s) % bookColors.length];
        ctx.fillRect(bx, sy - bHeight, 22, bHeight);

        // Gold foil spine markings
        ctx.fillStyle = "#FBBF24";
        ctx.fillRect(bx + 4, sy - bHeight + 8, 14, 3);
        ctx.fillRect(bx + 4, sy - 14, 14, 3);
      }
    }
  }

  // Purple / Cyan LED Rim Glow
  ctx.strokeStyle = "rgba(139, 92, 246, 0.4)";
  ctx.lineWidth = 2;
  ctx.strokeRect(-shelfW / 2 - 2, -shelfH / 2 - 2, shelfW + 4, shelfH + 4);

  ctx.restore();
}

// ========================================================
// GLOBAL RENDER FUNCTION (1,320 frames @ 60 FPS)
// ========================================================
window.renderFrame = function(frameIndex, totalFrames = 1320) {
  // Clear frame
  ctx.fillStyle = "#070709";
  ctx.fillRect(0, 0, W, H);

  const tSec = frameIndex / FPS;

  // Background subtle radial gradient & ambient particles
  const bgGrad = ctx.createRadialGradient(W / 2, H / 2, 60, W / 2, H / 2, 950);
  bgGrad.addColorStop(0, "#0E0E16");
  bgGrad.addColorStop(1, "#070709");
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  // Background floating micro-particles
  ctx.save();
  for (let i = 0; i < PARTICLES.length; i++) {
    const p = PARTICLES[i];
    const py = (p.y - tSec * 22 * p.speed) % H;
    const finalY = py < 0 ? py + H : py;
    ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha * 0.4})`;
    ctx.beginPath();
    ctx.arc(p.x, finalY, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();

  // ========================================================
  // BEAT 1: 0.0s - 3.8s (Frames 0 - 228) - The Overwhelm
  // ========================================================
  if (frameIndex < 228) {
    // Floor platform
    ctx.fillStyle = "#18181B";
    ctx.fillRect(0, 890, W, 190);
    ctx.strokeStyle = "#27272A";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, 890);
    ctx.lineTo(W, 890);
    ctx.stroke();

    // Raining skill chips
    SKILLS.forEach(skill => {
      const activeFrames = frameIndex - skill.delay;
      if (activeFrames > 0) {
        let currentY = -70 + activeFrames * skill.fallSpeed;
        let currentX = skill.startX;
        let currentRot = skill.rot;

        if (currentY >= skill.targetY) {
          currentY = skill.targetY;
          currentX = skill.targetX;
        } else {
          currentRot += activeFrames * 0.04;
        }

        drawSkillBadge(skill.name, currentX, currentY, currentRot, skill.color, 0.95);
      }
    });

    // Mascot
    const isPanicked = frameIndex > 75;
    const sweatVal = isPanicked ? clamp((frameIndex - 75) / 35, 0, 1) : 0;
    const mascotY = 820 + (isPanicked ? Math.sin(frameIndex * 0.7) * 4 : 0);

    drawMascot(960, mascotY, 1.4, {
      eyes: isPanicked ? 'panic' : 'normal',
      sweat: sweatVal,
      hasHat: false,
      typing: !isPanicked
    });

    // Red Warning HUD (Frames 100 - 228) - RENDERED ON TOP OF CHIPS
    if (frameIndex > 95) {
      const alertAlpha = clamp((frameIndex - 95) / 25, 0, 1);
      const pulse = 0.7 + 0.3 * Math.sin(frameIndex * 0.35);

      // Screen edge red vignette
      ctx.save();
      ctx.strokeStyle = `rgba(239, 68, 68, ${0.45 * pulse * alertAlpha})`;
      ctx.lineWidth = 28;
      ctx.strokeRect(14, 14, W - 28, H - 28);

      // Warning Card at top
      ctx.translate(W / 2, 140);
      ctx.fillStyle = `rgba(28, 10, 10, ${0.96 * alertAlpha})`;
      ctx.strokeStyle = `rgba(239, 68, 68, ${pulse * alertAlpha})`;
      ctx.lineWidth = 2.5;
      ctx.shadowColor = "rgba(239, 68, 68, 0.6)";
      ctx.shadowBlur = 25;
      ctx.beginPath();
      ctx.roundRect(-420, -52, 840, 104, 16);
      ctx.fill();
      ctx.stroke();
      ctx.shadowBlur = 0;

      // Top line
      ctx.fillStyle = "#EF4444";
      ctx.font = "bold 28px -apple-system, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("⚠️ 66% OF SKILLS TRUNCATED", 0, -14);

      // Bottom line
      ctx.fillStyle = "#FCA5A5";
      ctx.font = "bold 16px 'SF Mono', Consolas, monospace";
      ctx.fillText("CONTEXT WINDOW EXCEEDED (PROMPT LIMIT REACHED)", 0, 22);

      ctx.restore();
    }
  }

  // ========================================================
  // BEAT 2: 3.8s - 8.0s (Frames 228 - 480) - Wizard Hat & 3D Spiral
  // ========================================================
  else if (frameIndex < 480) {
    const b2Local = frameIndex - 228; // 0 to 252

    // Floor
    ctx.fillStyle = "#18181B";
    ctx.fillRect(0, 890, W, 190);
    ctx.strokeStyle = "#27272A";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, 890);
    ctx.lineTo(W, 890);
    ctx.stroke();

    // Bookshelf emerging on right
    const shelfProg = clamp((b2Local - 40) / 70, 0, 1);
    drawBookshelf(1500, 620, shelfProg);

    // Wizard Hat descending (b2Local: 0 to 48)
    const hatEquipped = b2Local >= 48;
    let hatY = -90;
    let hatHover = 0;
    if (!hatEquipped) {
      const dropProg = easeOutBounceOrCubic(b2Local / 48);
      hatY = lerp(-90, 820 - 68 * 1.4, dropProg);
      hatHover = Math.sin(b2Local * 0.2) * 5;
    }

    // Shockwave burst at b2Local = 48 (Frames 276+)
    if (b2Local >= 48 && b2Local <= 120) {
      const swProg = (b2Local - 48) / 72;
      const swRadius = swProg * 1100;
      const swAlpha = (1 - swProg);
      ctx.save();
      ctx.strokeStyle = `rgba(168, 85, 247, ${swAlpha})`;
      ctx.lineWidth = 10 * (1 - swProg);
      ctx.beginPath();
      ctx.arc(680, 820, swRadius, 0, Math.PI * 2);
      ctx.stroke();

      // Magic sparkles
      for (let s = 0; s < 20; s++) {
        const ang = s * (Math.PI * 2 / 20) + b2Local * 0.1;
        const dist = swRadius * 0.9;
        ctx.fillStyle = `rgba(244, 208, 63, ${swAlpha})`;
        ctx.beginPath();
        ctx.arc(680 + Math.cos(ang) * dist, 820 + Math.sin(ang) * dist, 4.5, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    // 3D Spiral Vortex of skills (b2Local: 50 to 220)
    const spiralProg = clamp((b2Local - 50) / 160, 0, 1);

    if (spiralProg > 0 && spiralProg < 1.0) {
      // Magic spiral glowing trail arcs
      ctx.save();
      ctx.strokeStyle = `rgba(168, 85, 247, ${0.35 * Math.sin(spiralProg * Math.PI)})`;
      ctx.lineWidth = 3;
      ctx.beginPath();
      for (let st = 0; st <= 40; st++) {
        const pT = clamp(spiralProg - 0.15 + (st / 40) * 0.15, 0, 1);
        const ang = pT * 12.0 + (st * 0.15);
        const r = lerp(520, 50, easeInCubic(pT));
        const cX = lerp(960, 1500, easeInOutCubic(pT));
        const cY = lerp(820, 440, easeInOutCubic(pT));
        const sX = cX + Math.cos(ang) * r;
        const sY = cY + Math.sin(ang) * (r * 0.4) - (pT * 120);
        if (st === 0) ctx.moveTo(sX, sY);
        else ctx.lineTo(sX, sY);
      }
      ctx.stroke();
      ctx.restore();
    }

    if (spiralProg < 1.0) {
      const spiralItems = SKILLS.map(skill => {
        if (spiralProg === 0) {
          return { skill, x: skill.targetX, y: skill.targetY, z: 0, rot: skill.rot, scale: 0.95, alpha: 1 };
        }
        
        const tVal = spiralProg;
        // Ascending double-helix spiral
        const angle = tVal * 12.0 + skill.index * (Math.PI * 2 / 16);
        const baseR = lerp(520, 50, easeInCubic(tVal));
        const targetShelfX = 1500;
        const targetShelfY = 440 + (skill.index % 4) * 100;
        
        const startX = skill.targetX;
        const startY = skill.targetY;
        
        // Helical curve sweeping upward
        const currCenterX = lerp(startX, targetShelfX, easeInOutCubic(tVal));
        const currCenterY = lerp(startY, targetShelfY, easeInOutCubic(tVal));
        
        const x3d = currCenterX + Math.cos(angle) * baseR;
        const y3d = currCenterY + Math.sin(angle) * (baseR * 0.4) - (tVal * 120);
        const z3d = Math.sin(angle); // -1 (back) to 1 (front)
        
        const scale = clamp(0.95 * (1 + z3d * 0.3) * (1 - tVal * 0.5), 0.25, 1.25);
        const alpha = clamp(1.0 - tVal * 0.4 + z3d * 0.25, 0, 1);
        
        return { skill, x: x3d, y: y3d, z: z3d, rot: angle * 0.4, scale, alpha };
      });

      // Sort by depth Z
      spiralItems.sort((a, b) => a.z - b.z);
      spiralItems.forEach(item => {
        drawSkillBadge(item.skill.name, item.x, item.y, item.rot, item.skill.color, item.scale, item.alpha);
      });
    }

    // Mascot
    const armRaiseProg = clamp((b2Local - 48) / 30, 0, 1);
    drawMascot(680, 820, 1.4, {
      eyes: b2Local >= 48 ? 'magic' : 'normal',
      sweat: 0,
      hasHat: hatEquipped,
      hatGlow: b2Local >= 48 ? 1.0 : 0.0,
      armAngle: -0.6 * easeOutBack(armRaiseProg),
      magicAntenna: b2Local >= 48
    });

    if (!hatEquipped) {
      drawWizardHat(680, hatY + hatHover, 0.85);
    }
  }

  // ========================================================
  // BEAT 3: 8.0s - 11.5s (Frames 480 - 690) - The Levitation Spell
  // ========================================================
  else if (frameIndex < 690) {
    const b3Local = frameIndex - 480; // 0 to 210

    // Bookshelf on right
    drawBookshelf(1500, 620, 1.0);

    // Floating Terminal Prompt typing at top
    const fullPrompt = '> "Audit postgres pool sizing and slow queries"';
    const charsTyped = Math.floor(clamp(b3Local / 75, 0, 1) * fullPrompt.length);
    const displayedPrompt = fullPrompt.substring(0, charsTyped);

    ctx.save();
    ctx.translate(W / 2, 140);
    ctx.fillStyle = "rgba(18, 18, 24, 0.95)";
    ctx.strokeStyle = "rgba(139, 92, 246, 0.7)";
    ctx.lineWidth = 1.5;
    ctx.shadowColor = "rgba(139, 92, 246, 0.3)";
    ctx.shadowBlur = 20;
    ctx.beginPath();
    ctx.roundRect(-440, -34, 880, 68, 14);
    ctx.fill();
    ctx.stroke();
    ctx.shadowBlur = 0;

    // Terminal dots
    ctx.fillStyle = "#EF4444"; ctx.beginPath(); ctx.arc(-410, 0, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#FBBF24"; ctx.beginPath(); ctx.arc(-395, 0, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#10B981"; ctx.beginPath(); ctx.arc(-380, 0, 5, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = "#E4E4E7";
    ctx.font = "bold 20px 'SF Mono', Consolas, monospace";
    ctx.textAlign = "left";
    ctx.textBaseline = "middle";
    ctx.fillText(displayedPrompt, -350, 0);

    // Cursor
    if (b3Local < 90 && Math.floor(frameIndex / 15) % 2 === 0) {
      const textW = ctx.measureText(displayedPrompt).width;
      ctx.fillStyle = "#8B5CF6";
      ctx.fillRect(-345 + textW, -12, 10, 24);
    }
    ctx.restore();

    // Levitating Golden Tome [postgresql.md]
    // Starts at shelf (1420, 560) and curves to mascot hand (820, 740)
    const levProg = clamp((b3Local - 60) / 75, 0, 1);
    const tomeEased = easeInOutCubic(levProg);

    const tomeStartX = 1420;
    const tomeStartY = 560;
    const tomeTargetX = 820;
    const tomeTargetY = 740;

    const arcHeight = Math.sin(tomeEased * Math.PI) * -140;
    const tomeX = lerp(tomeStartX, tomeTargetX, tomeEased);
    const tomeY = lerp(tomeStartY, tomeTargetY, tomeEased) + arcHeight;

    // Golden Tome
    ctx.save();
    ctx.translate(tomeX, tomeY);

    // Aura Glow
    const auraGlow = ctx.createRadialGradient(0, 0, 15, 0, 0, 85);
    auraGlow.addColorStop(0, "rgba(245, 158, 11, 0.85)");
    auraGlow.addColorStop(1, "rgba(245, 158, 11, 0)");
    ctx.fillStyle = auraGlow;
    ctx.beginPath();
    ctx.arc(0, 0, 85, 0, Math.PI * 2);
    ctx.fill();

    // Tome Book
    const bookScale = 1.0 + levProg * 0.35;
    ctx.scale(bookScale, bookScale);
    ctx.fillStyle = "#D97706";
    ctx.strokeStyle = "#FDE68A";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.roundRect(-28, -42, 56, 84, 6);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = "#FDE68A";
    ctx.font = "bold 11px monospace";
    ctx.textAlign = "center";
    ctx.fillText("POSTGRES", 0, -2);
    ctx.font = "8px monospace";
    ctx.fillText(".MD", 0, 12);

    ctx.restore();

    // HUD Pill Badge Blooming: '⚡ Activated: postgresql (0ms disk read)'
    // Positioned safely ABOVE the book and to the right of Claude's hat!
    if (b3Local > 130) {
      const pillProg = clamp((b3Local - 130) / 22, 0, 1);
      const pillScale = easeOutBack(pillProg);
      ctx.save();
      ctx.translate(880, 560); // Clearly above the book, clear of hat
      ctx.scale(pillScale, pillScale);

      ctx.fillStyle = "rgba(6, 78, 59, 0.95)";
      ctx.strokeStyle = "#10B981";
      ctx.lineWidth = 2;
      ctx.shadowColor = "#10B981";
      ctx.shadowBlur = 20;
      ctx.beginPath();
      ctx.roundRect(-200, -24, 400, 48, 24);
      ctx.fill();
      ctx.stroke();
      ctx.shadowBlur = 0;

      ctx.fillStyle = "#34D399";
      ctx.font = "bold 17px -apple-system, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("⚡ Activated: postgresql  (0ms disk read)", 0, 1);
      ctx.restore();
    }

    // Mascot
    drawMascot(680, 820, 1.4, {
      eyes: 'magic',
      sweat: 0,
      hasHat: true,
      hatGlow: 1.0,
      armAngle: -0.6,
      magicAntenna: true
    });

    // Book opens toward camera & volumetric golden rays zoom (b3Local: 155 to 210)
    if (b3Local > 150) {
      const rayProg = (b3Local - 150) / 60;
      const rayScale = Math.pow(rayProg, 2.6) * 15;
      const rayAlpha = clamp(rayProg * 1.6, 0, 1);

      ctx.save();
      ctx.translate(tomeTargetX, tomeTargetY);

      // Expanding golden light rays
      for (let r = 0; r < 16; r++) {
        const ang = r * (Math.PI * 2 / 16) + b3Local * 0.04;
        ctx.fillStyle = `rgba(251, 191, 36, ${0.45 * rayAlpha})`;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(ang - 0.1) * 2200, Math.sin(ang - 0.1) * 2200);
        ctx.lineTo(Math.cos(ang + 0.1) * 2200, Math.sin(ang + 0.1) * 2200);
        ctx.closePath();
        ctx.fill();
      }

      // Center blinding warm flash
      const flash = ctx.createRadialGradient(0, 0, 10, 0, 0, 500 * rayScale + 20);
      flash.addColorStop(0, `rgba(255, 255, 255, ${rayAlpha})`);
      flash.addColorStop(0.35, `rgba(251, 191, 36, ${0.85 * rayAlpha})`);
      flash.addColorStop(1, "rgba(251, 191, 36, 0)");
      ctx.fillStyle = flash;
      ctx.fillRect(-W, -H, W * 2, H * 2);

      ctx.restore();
    }
  }

  // ========================================================
  // BEAT 4: 11.5s - 18.5s (Frames 690 - 1110) - Apple Keynote Stats
  // ========================================================
  else if (frameIndex < 1110) {
    const b4Local = frameIndex - 690; // 0 to 420 (7.0 seconds)

    ctx.save();
    ctx.translate(W / 2, H / 2);

    // Studio Ambient Light
    const studioGlow = ctx.createRadialGradient(0, 0, 60, 0, 0, 850);
    studioGlow.addColorStop(0, "rgba(24, 24, 40, 0.7)");
    studioGlow.addColorStop(1, "rgba(7, 7, 9, 0)");
    ctx.fillStyle = studioGlow;
    ctx.fillRect(-W / 2, -H / 2, W, H);

    // ----------------------------------------------------
    // METRIC 1: Frames 690 - 830 (b4Local: 0 - 140) -> 100% REACHABLE
    if (b4Local < 140) {
      const m1Prog = clamp(b4Local / 85, 0, 1);
      const cardAlpha = clamp(b4Local / 20, 0, 1) * (b4Local > 120 ? (140 - b4Local) / 20 : 1);
      ctx.globalAlpha = cardAlpha;

      const counterVal = Math.floor(lerp(34, 100, easeOutCubic(m1Prog)));
      const isEmerald = counterVal >= 98;
      const metricColor = isEmerald ? "#10B981" : "#F59E0B";

      // 1px Frosted Glass Card
      ctx.fillStyle = "rgba(255, 255, 255, 0.035)";
      ctx.strokeStyle = "rgba(255, 255, 255, 0.12)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.roundRect(-540, -270, 1080, 540, 24);
      ctx.fill();
      ctx.stroke();

      // Top Tag
      ctx.fillStyle = "#A1A1AA";
      ctx.font = "bold 20px -apple-system, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("SKILL REACHABILITY", 0, -180);

      // Huge Hero Metric
      ctx.fillStyle = metricColor;
      ctx.shadowColor = metricColor;
      ctx.shadowBlur = isEmerald ? 35 : 0;
      ctx.font = "bold 165px -apple-system, BlinkMacSystemFont, sans-serif";
      ctx.fillText(`${counterVal}%`, 0, 5);
      ctx.shadowBlur = 0;

      // Progress bar below metric
      ctx.fillStyle = "rgba(255, 255, 255, 0.1)";
      ctx.beginPath();
      ctx.roundRect(-300, 48, 600, 10, 5);
      ctx.fill();

      ctx.fillStyle = metricColor;
      ctx.beginPath();
      ctx.roundRect(-300, 48, 600 * (counterVal / 100), 10, 5);
      ctx.fill();

      // Shockwave Ring at 100%
      if (b4Local >= 85) {
        const burstProg = (b4Local - 85) / 50;
        ctx.strokeStyle = `rgba(16, 185, 129, ${1 - burstProg})`;
        ctx.lineWidth = 4.5 * (1 - burstProg);
        ctx.beginPath();
        ctx.arc(0, -10, 230 + burstProg * 220, 0, Math.PI * 2);
        ctx.stroke();
      }

      // Subtitle Card
      ctx.fillStyle = "#FFFFFF";
      ctx.font = "bold 34px -apple-system, sans-serif";
      ctx.fillText("1,050 / 1,050 Skills Indexed", 0, 130);

      ctx.fillStyle = "#9CA3AF";
      ctx.font = "20px -apple-system, sans-serif";
      ctx.fillText("Zero Truncation • Instant Access Across All Domains", 0, 180);
    }

    // ----------------------------------------------------
    // METRIC 2: Frames 830 - 970 (b4Local: 140 - 280) -> 0 DISK READS
    else if (b4Local < 280) {
      const m2Local = b4Local - 140;
      const cardAlpha = clamp(m2Local / 20, 0, 1) * (m2Local > 120 ? (140 - m2Local) / 20 : 1);
      ctx.globalAlpha = cardAlpha;

      const pushProg = easeOutCubic(clamp(m2Local / 30, 0, 1));
      const scale = lerp(0.92, 1.0, pushProg);
      ctx.scale(scale, scale);

      // 1px Frosted Glass Card
      ctx.fillStyle = "rgba(255, 255, 255, 0.035)";
      ctx.strokeStyle = "rgba(255, 255, 255, 0.12)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.roundRect(-540, -270, 1080, 540, 24);
      ctx.fill();
      ctx.stroke();

      // Top Tag
      ctx.fillStyle = "#A1A1AA";
      ctx.font = "bold 20px -apple-system, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("I/O BOTTLENECK ELIMINATED", 0, -180);

      // Huge Hero Metric
      ctx.fillStyle = "#FFFFFF";
      ctx.shadowColor = "rgba(255, 255, 255, 0.6)";
      ctx.shadowBlur = 30;
      ctx.font = "bold 135px -apple-system, BlinkMacSystemFont, sans-serif";
      ctx.fillText("0 DISK READS", 0, 10);
      ctx.shadowBlur = 0;

      // Latency badge pill
      ctx.fillStyle = "rgba(59, 130, 246, 0.15)";
      ctx.strokeStyle = "#3B82F6";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.roundRect(-180, 55, 360, 40, 20);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "#60A5FA";
      ctx.font = "bold 16px 'SF Mono', Consolas, monospace";
      ctx.fillText("< 0.001ms INLINE LATENCY", 0, 80);

      // Subtitle Card
      ctx.fillStyle = "#FFFFFF";
      ctx.font = "bold 32px -apple-system, sans-serif";
      ctx.fillText("Zero I/O Latency", 0, 145);

      ctx.fillStyle = "#9CA3AF";
      ctx.font = "20px -apple-system, sans-serif";
      ctx.fillText("Embedded inline directly in system rules", 0, 195);
    }

    // ----------------------------------------------------
    // METRIC 3: Frames 970 - 1110 (b4Local: 280 - 420) -> ~90% COST SAVED
    else {
      const m3Local = b4Local - 280;
      const cardAlpha = clamp(m3Local / 20, 0, 1) * (m3Local > 120 ? (140 - m3Local) / 20 : 1);
      ctx.globalAlpha = cardAlpha;

      const pushProg = easeOutCubic(clamp(m3Local / 30, 0, 1));
      const scale = lerp(0.92, 1.0, pushProg);
      ctx.scale(scale, scale);

      // 1px Frosted Glass Card
      ctx.fillStyle = "rgba(255, 255, 255, 0.035)";
      ctx.strokeStyle = "rgba(255, 255, 255, 0.12)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.roundRect(-540, -270, 1080, 540, 24);
      ctx.fill();
      ctx.stroke();

      // Top Tag
      ctx.fillStyle = "#A1A1AA";
      ctx.font = "bold 20px -apple-system, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("LLM TOKEN OPTIMIZATION", 0, -180);

      // Huge Hero Metric
      ctx.fillStyle = "#06B6D4";
      ctx.shadowColor = "#06B6D4";
      ctx.shadowBlur = 40;
      ctx.font = "bold 135px -apple-system, BlinkMacSystemFont, sans-serif";
      ctx.fillText("~90% COST SAVED", 0, 10);
      ctx.shadowBlur = 0;

      // Caching badge pill
      ctx.fillStyle = "rgba(6, 182, 212, 0.15)";
      ctx.strokeStyle = "#06B6D4";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.roundRect(-210, 55, 420, 40, 20);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "#67E8F9";
      ctx.font = "bold 16px 'SF Mono', Consolas, monospace";
      ctx.fillText("PROMPT CACHING FULLY LEVERAGED", 0, 80);

      // Subtitle Card
      ctx.fillStyle = "#FFFFFF";
      ctx.font = "bold 32px -apple-system, sans-serif";
      ctx.fillText("Cached System Prefix", 0, 145);

      ctx.fillStyle = "#9CA3AF";
      ctx.font = "20px -apple-system, sans-serif";
      ctx.fillText("10x cheaper token reads • Zero redundant indexing calls", 0, 195);
    }

    ctx.restore();
  }

  // ========================================================
  // BEAT 5: 18.5s - 22.0s (Frames 1110 - 1320) - Outro & CTA
  // ========================================================
  else {
    const b5Local = frameIndex - 1110; // 0 to 210
    const settleProg = clamp(b5Local / 35, 0, 1);
    const easedSettle = easeOutCubic(settleProg);

    ctx.save();

    // 3D Isometric / Perspective floating card
    const cardX = lerp(W / 2 - 80, W / 2 - 140, easedSettle);
    const cardY = 440;

    // Terminal typing: 'python install.py'
    const cmdStr = "python install.py";
    const typeProg = clamp((b5Local - 15) / 70, 0, 1);
    const typedChars = Math.floor(typeProg * cmdStr.length);
    const typedCmd = cmdStr.substring(0, typedChars);
    const executed = b5Local >= 95;

    // Terminal Card
    ctx.save();
    ctx.translate(cardX - 170, cardY);
    ctx.transform(1, 0, -0.03, 1, 0, 0);

    // Terminal Box
    ctx.fillStyle = "rgba(18, 18, 26, 0.96)";
    ctx.strokeStyle = "rgba(255, 255, 255, 0.16)";
    ctx.lineWidth = 1.5;
    ctx.shadowColor = "rgba(0, 0, 0, 0.7)";
    ctx.shadowBlur = 45;
    ctx.beginPath();
    ctx.roundRect(-310, -185, 620, 360, 18);
    ctx.fill();
    ctx.stroke();
    ctx.shadowBlur = 0;

    // Window controls
    ctx.fillStyle = "#EF4444"; ctx.beginPath(); ctx.arc(-280, -155, 6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#FBBF24"; ctx.beginPath(); ctx.arc(-262, -155, 6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#10B981"; ctx.beginPath(); ctx.arc(-244, -155, 6, 0, Math.PI * 2); ctx.fill();

    // Title bar text
    ctx.fillStyle = "#71717A";
    ctx.font = "bold 13px -apple-system, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("bash - RememberMe v2.0 Setup", 0, -155);

    // Terminal command line
    ctx.textAlign = "left";
    ctx.font = "bold 21px 'SF Mono', Consolas, monospace";
    ctx.fillStyle = "#10B981";
    ctx.fillText("$", -280, -95);
    ctx.fillStyle = "#FFFFFF";
    ctx.fillText(typedCmd, -255, -95);

    // Cursor
    if (b5Local < 95 && Math.floor(frameIndex / 15) % 2 === 0) {
      const tw = ctx.measureText(typedCmd).width;
      ctx.fillStyle = "#8B5CF6";
      ctx.fillRect(-250 + tw, -112, 11, 23);
    }

    // Output lines on execution
    if (executed) {
      ctx.fillStyle = "#34D399";
      ctx.font = "15px 'SF Mono', Consolas, monospace";
      ctx.fillText("✔ Installed RememberMe v2 rules", -280, -48);
      ctx.fillText("✔ Indexed 1,050 skills into inline rules", -280, -18);
      ctx.fillText("✔ Zero I/O latency configured", -280, 12);
      ctx.fillText("✔ Ready for Antigravity & Claude Code", -280, 42);

      ctx.fillStyle = "#F59E0B";
      ctx.fillText("⚡ Ready to assist. 100% skill reachability active.", -280, 92);
    }
    ctx.restore();

    // Mascot beside terminal (winking with wizard hat!)
    const mascotX = cardX + 410;
    const mascotY = 475;
    drawMascot(mascotX, mascotY, 1.85, {
      eyes: 'wink',
      sweat: 0,
      hasHat: true,
      hatGlow: 1.0,
      armAngle: -0.4,
      magicAntenna: true
    });

    // Branding & CTA at bottom
    ctx.save();
    ctx.translate(W / 2, 855);

    // Headline
    ctx.fillStyle = "#FFFFFF";
    ctx.font = "bold 58px -apple-system, BlinkMacSystemFont, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("RememberMe v2.0", 0, -42);

    // Subtitle
    ctx.fillStyle = "#A1A1AA";
    ctx.font = "24px -apple-system, sans-serif";
    ctx.fillText("The Missing Skill Index for AI Agents", 0, 10);

    // Platform Badges with brand color dots
    const platforms = [
      { name: "Antigravity", color: "#3B82F6" },
      { name: "Claude Code", color: "#F97316" },
      { name: "Cursor", color: "#8B5CF6" },
      { name: "Codex", color: "#10B981" }
    ];
    const totalBadgesW = platforms.length * 155 + (platforms.length - 1) * 20;
    let badgeStartX = -totalBadgesW / 2 + 77;

    platforms.forEach(plat => {
      ctx.save();
      ctx.translate(badgeStartX, 68);

      ctx.fillStyle = "rgba(255, 255, 255, 0.05)";
      ctx.strokeStyle = "rgba(255, 255, 255, 0.15)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.roundRect(-72, -19, 144, 38, 19);
      ctx.fill();
      ctx.stroke();

      // Brand dot
      ctx.fillStyle = plat.color;
      ctx.beginPath();
      ctx.arc(-48, 0, 4.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#F4F4F5";
      ctx.font = "bold 15px -apple-system, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(plat.name, 8, 0);

      ctx.restore();
      badgeStartX += 175;
    });

    ctx.restore();

    ctx.restore();
  }
};

function easeOutBounceOrCubic(x) {
  return 1 - Math.pow(1 - x, 3);
}
</script>
</body>
</html>
